name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AI_ANALYST_NO_CLOUD: "1"

jobs:
  server:
    name: Server on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  bun:
    name: Server on Bun, and the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: npm ci --ignore-scripts
      - run: bun run test:bun
      - run: bun run build
        working-directory: web
      - run: bun run build:demo
        working-directory: web
      - run: bun run smoke
        working-directory: web
