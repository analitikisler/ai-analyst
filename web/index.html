<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai analyst</title>
    <meta name="description" content="Ask in Turkish or English. Every answer shows its chart, the SQL it ran, the metric definition and a check against the system that owns the number." />
    <meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071529" media="(prefers-color-scheme: dark)" />
    <!-- The ai tool favicon (brand/ai BRAND.md §7): the mark alone; the ink tile on a dark system. -->
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="./brand/favicon-ai-16.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="./brand/favicon-ai-32.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" sizes="64x64" href="./brand/favicon-ai-64.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="./brand/favicon-ai-16-ink.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="./brand/favicon-ai-32-ink.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" sizes="64x64" href="./brand/favicon-ai-64-ink.svg" media="(prefers-color-scheme: dark)" />
    <!-- The ai analyst app icon; the PNG is made from ai-analyst-512.svg with macOS sips (see README). -->
    <link rel="apple-touch-icon" sizes="180x180" href="./brand/apple-touch-icon.png" />
    <!-- Google Sans family, self-hosted (public/fonts, OFL-1.1). Preload only the display face. -->
    <link rel="preload" href="./fonts/google-sans-flex-display.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme and language before first paint. Keys match src/lib/prefs.ts.
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem("ai-analyst:theme") || '"system"');
          if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
          var lang = JSON.parse(localStorage.getItem("ai-analyst:lang") || '"system"');
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
          document.documentElement.lang = lang === "en" || lang === "tr" ? lang : /^tr/i.test(nav) ? "tr" : "en";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
